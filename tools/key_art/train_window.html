<!doctype html>
<!--
  Key art scene: a phone held in a rainy train window (docs/KEY_ART.md).
  Deterministic per frame: window.renderFrame({ t, frameUrl, ... }) draws
  the world (WebGL pass 1, half res), the glass (pass 2, full res) and the
  phone + hand around the captured reader frame (2D canvas).
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<canvas id="fg" width="1080" height="1920"></canvas>
<script>
'use strict'
const W = 1080, H = 1920, WW = 540, WH = 960

// ---------------------------------------------------------------- variants
const VARIANTS = {
  paper_dawn: {
    id: 0,
    skyTop: [0.47, 0.54, 0.59], skyHorizon: [0.80, 0.81, 0.78], cloud: [0.58, 0.62, 0.65],
    breakColor: [1.0, 0.88, 0.66], breakPos: [700, 215], glow: 0.42,
    far: [0.48, 0.57, 0.61], mid: [0.33, 0.41, 0.38], near: [0.17, 0.22, 0.19], mast: [0.10, 0.11, 0.11],
    fog: [0.74, 0.78, 0.78], wall: [0.10, 0.11, 0.11], horizon: 345,
    reflect: [0.9, 0.95, 1.0], grade: [1.0, 1.0, 1.02],
    sleeve: ['#d9cbb3', '#b9a88d', '#8e7e66'], skin: '#c49376', skinLit: '#e2b89c', skinShade: '#8a5c45',
    rim: 'rgba(220,235,245,0.55)', screenGlow: 'rgba(255,248,235,0.0)', phoneEdge: '#c9ccd0',
  },
  nightfall_line: {
    id: 1,
    skyTop: [0.035, 0.06, 0.12], skyHorizon: [0.17, 0.21, 0.32], cloud: [0.10, 0.13, 0.20],
    breakColor: [0.85, 0.90, 1.0], breakPos: [760, 170], glow: 0.7,
    far: [0.09, 0.11, 0.17], mid: [0.05, 0.065, 0.10], near: [0.02, 0.025, 0.035], mast: [0.01, 0.012, 0.016],
    fog: [0.16, 0.19, 0.27], wall: [0.035, 0.03, 0.028], horizon: 385,
    reflect: [1.0, 0.78, 0.5], grade: [1.0, 0.98, 1.02],
    sleeve: ['#3b3a3d', '#29282b', '#18171a'], skin: '#9c6c52', skinLit: '#c9967a', skinShade: '#4e3022',
    rim: 'rgba(140,165,215,0.45)', screenGlow: 'rgba(255,236,200,0.16)', phoneEdge: '#6d6f74',
  },
  royal_valley: {
    id: 2,
    skyTop: [0.15, 0.18, 0.20], skyHorizon: [0.60, 0.64, 0.60], cloud: [0.26, 0.29, 0.31],
    breakColor: [1.0, 0.84, 0.50], breakPos: [650, 150], glow: 0.6,
    far: [0.30, 0.42, 0.40], mid: [0.12, 0.26, 0.15], near: [0.035, 0.09, 0.06], mast: [0.02, 0.03, 0.025],
    fog: [0.56, 0.62, 0.60], wall: [0.03, 0.05, 0.04], horizon: 430,
    reflect: [0.85, 1.0, 0.9], grade: [0.98, 1.02, 0.99],
    sleeve: ['#5b6a4c', '#46543a', '#2e3826'], skin: '#b98a6c', skinLit: '#dcae90', skinShade: '#74503a',
    rim: 'rgba(200,230,205,0.5)', screenGlow: 'rgba(240,255,240,0.06)', phoneEdge: '#9aa39c',
  },
}

// ---------------------------------------------------------------- GL setup
const gl = document.getElementById('gl').getContext('webgl2', { preserveDrawingBuffer: true, antialias: false })

const COMMON = `#version 300 es
precision highp float;
uniform float uT; uniform int uVar; uniform float uBreak, uStars, uOpen;
uniform vec3 uSkyTop, uSkyHor, uCloud, uBreakCol, uFar, uMid, uNear, uMast, uFog, uWall, uReflect, uGrade;
uniform vec2 uBreakPos; uniform float uHorizon, uGlow;
float h11(float p){ p = fract(p*0.1031); p *= p+33.33; p *= p+p; return fract(p); }
float h21(vec2 p){ vec3 q = fract(vec3(p.xyx)*0.1031); q += dot(q, q.yzx+33.33); return fract((q.x+q.y)*q.z); }
vec3 h23(vec2 p){ vec3 q = fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); q += dot(q, q.yxz+33.33); return fract((q.xxy+q.yzz)*q.zyx); }
float vn(float x){ float i = floor(x), f = fract(x); f = f*f*(3.-2.*f); return mix(h11(i), h11(i+1.), f); }
float vn2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y); }
float fbm1(float x){ float s = 0., a = .5; for (int i = 0; i < 5; i++){ s += a*vn(x); x *= 2.03; a *= .5; } return s; }
float fbm2(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 5; i++){ s += a*vn2(p); p = p*2.02 + 17.1; a *= .5; } return s; }
`

// World: P is final-frame px, y down. Everything is already soft (it is far
// out of focus); fast layers lose their high frequencies (motion blur).
const WORLD_FS = COMMON + `
out vec4 o;
uniform vec2 uRes;
float ridge(float x, float base, float amp, float freq, float seed){ return base - amp*fbm1(x*freq + seed); }
// ridged noise: sharp peaks for mountains
float mtn(float x){ float s = 0., a = .55; for (int i = 0; i < 5; i++){ float n = 1. - abs(2.*vn(x) - 1.); s += a*n*n; x *= 2.13; a *= .47; } return s; }
vec3 sky(vec2 P){
  float y = clamp(P.y / uHorizon, 0., 1.);
  vec3 c = mix(uSkyTop, uSkyHor, pow(y, 1.4));
  // clouds drift slowly with the far layer
  vec2 q = vec2(P.x*0.0018 + uT*0.012, P.y*0.0042);
  float n = fbm2(q*vec2(1.,1.6) + vec2(uT*0.006, 0.));
  vec2 bp = uBreakPos;
  float dB = length((P - bp)*vec2(0.8, 1.15));
  float open = uBreak * smoothstep(520., 60., dB);         // the cloud parts round the break
  float cover = smoothstep(0.38 + open*0.35, 0.72 + open*0.3, n);
  c = mix(c, uCloud * (0.9 + 0.25*fbm2(q*3.)), cover*0.85*(1.-0.6*y));
  // the light-break: glow + crepuscular rays
  float glow = exp(-dB/180.) * uBreak;
  float ang = atan(P.y - bp.y, P.x - bp.x);
  float rays = 0.55 + 0.45*smoothstep(0.35, 0.8, vn(ang*9. + uT*0.05) * vn(ang*23.+3.));
  float rayFall = exp(-dB/520.) * uBreak * (P.y > bp.y ? 1. : 0.35);
  c += uBreakCol * (glow*0.85 + rayFall*rays*0.32) * uGlow * (1.-cover*0.55);
  if (uVar == 1) {  // night: moon disc + stars
    float md = length(P - bp);
    c += uBreakCol * (smoothstep(26., 22., md)*0.9 + exp(-md/60.)*0.25) * uBreak * (1. - cover*0.8);
    vec2 sc = floor(P/9.);
    float s = step(0.9965, h21(sc)) * smoothstep(0.6, 1., h21(sc+3.)) ;
    vec2 sp = fract(P/9.) - 0.5;
    s *= smoothstep(0.5, 0.15, length(sp));
    c += vec3(0.85, 0.9, 1.) * s * uStars * (1.-cover) * (1.-y) * (0.6 + 0.4*sin(uT*3. + h21(sc)*40.));
  }
  return c;
}
vec3 world(vec2 P){
  vec3 c = sky(P);
  float t = uT;
  // far layer: sea + headland (A), hills + town (B), mountains (C)
  float xf = P.x + t*7.;
  if (uVar == 0) {
    float sea = smoothstep(uHorizon-1.5, uHorizon+1.5, P.y);
    float sd = P.y - uHorizon;
    vec3 seaC = mix(mix(uFog*1.02, uFar*0.9, smoothstep(0., 90., sd)), uFar*0.75, smoothstep(60., 200., sd)) * (0.96 + 0.07*vn2(vec2(xf*0.03, P.y*0.5 - t*0.2)));
    seaC += uBreakCol * uBreak * 0.18 * exp(-sd/14.);
    float gl = pow(vn2(vec2(xf*0.08, P.y*0.9 - t*0.3)), 6.) * exp(-abs(P.x - uBreakPos.x)/220.) * uBreak;
    seaC += uBreakCol * gl * 1.4 * smoothstep(uHorizon, uHorizon+40., P.y);
    seaC += uBreakCol * 0.25 * uBreak * exp(-abs(P.x - uBreakPos.x)/160.) * smoothstep(uHorizon+60., uHorizon, P.y);
    c = mix(c, seaC, sea);
    float head = ridge(xf, uHorizon+2., 70., 0.0021, 4.) ;
    float hm = smoothstep(head-2., head+2., P.y) * smoothstep(150., 450., sin(xf*0.0011 + 1.)*600.);
    c = mix(c, mix(uFar*0.62, uFog, 0.4), hm);
  } else if (uVar == 1) {
    float hill = ridge(xf, uHorizon, 45., 0.003, 2.);
    float m = smoothstep(hill-2., hill+2., P.y);
    c = mix(c, uFar, m);
    // town lights on the horizon: round bokeh, warm and white
    float xl = P.x + t*22.;
    vec2 g = vec2(floor(xl/14.), 0.);
    for (int i = -2; i <= 2; i++) {
      vec2 cell = g + vec2(float(i), 0.);
      vec3 hh = h23(cell + 11.);
      if (hh.x < 0.45) continue;
      vec2 cp = vec2((cell.x + hh.y)*14. - t*22., uHorizon + 4. + hh.z*26.);
      float r = 4. + hh.y*5.;
      float d = length(P - cp);
      vec3 lc = mix(vec3(1., 0.72, 0.38), vec3(1., 0.93, 0.8), hh.z);
      c += lc * smoothstep(r, r-1.5, d) * (0.35 + 0.5*hh.x) * smoothstep(-300., 300., sin(cell.x*0.07)*400.);
    }
    c += vec3(0.9, 0.55, 0.3) * 0.12 * exp(-abs(P.y - uHorizon)/30.);
  } else {
    // a tall far range, then darker foothills, into a valley lit by the break
    {
      float xr = P.x + t*3.;
      float r = uHorizon - 30. - 290.*mtn(xr*0.0017 + 7.);
      float m = smoothstep(r - 2., r + 2., P.y);
      vec3 mc = mix(uFar*0.95, uFog, 0.5) * (0.9 + 0.14*fbm2(vec2(xr*0.012, P.y*0.012)));
      mc = mix(mc, mix(uFar*0.7, uFog, 0.35), smoothstep(r, r + 220., P.y));   // shadowed feet
      mc += uBreakCol * uBreak * 0.16 * exp(-length((P - vec2(uBreakPos.x + 60., r + 60.))*vec2(0.5, 1.))/220.);
      c = mix(c, mc, m);
      float xh = P.x + t*11.;
      float h2 = uHorizon + 10. - 95.*fbm1(xh*0.0035 + 3.) - 40.*mtn(xh*0.002 + 1.);
      float m2 = smoothstep(h2 - 2., h2 + 2., P.y);
      vec3 hc = mix(uMid*0.95, uFog, 0.32) * (0.9 + 0.15*vn2(vec2(xh*0.02, P.y*0.03)));
      c = mix(c, hc, m2);
    }
    float floorY = uHorizon + 25.;
    float fm = smoothstep(floorY-2., floorY+2., P.y);
    vec3 fc = mix(uMid*1.05, uFog, 0.3);
    float river = exp(-abs(P.y - floorY - 18. - 8.*sin((P.x+t*25.)*0.004))/3.);
    fc += mix(uSkyHor, uBreakCol, uBreak) * river * 0.22;
    fc += uBreakCol * uBreak * 0.35 * exp(-length((P - vec2(uBreakPos.x+40., floorY+20.))*vec2(0.35,1.))/150.);
    c = mix(c, fc, fm);
  }
  // mid layer: rolling field edges / hedgerows
  float xm = P.x + t*70.;
  float midR = ridge(xm, uHorizon + (uVar==0 ? 150. : 80.), 60., 0.004, 21.) - 22.*smoothstep(0.5, 0.9, vn(xm*0.03))*step(0.4, vn(xm*0.002));
  float mm = smoothstep(midR-3., midR+3., P.y);
  vec3 midC = mix(uMid, uFog, 0.25) * (0.85 + 0.25*vn2(vec2(xm*0.02, P.y*0.02)));
  c = mix(c, midC, mm);
  // near layer: trees and embankment rushing past (heavily smoothed)
  float xn = P.x + t*520.;
  float open = uOpen;
  float trees = (1.0 - open*0.85);
  float nearR = uHorizon + 230. + 200.*open - trees*(180.*fbm1(xn*0.0016 + 3.) + 90.*smoothstep(0.45, 0.8, vn(xn*0.0009)));
  float nm = smoothstep(nearR-10., nearR+10., P.y);
  vec3 nearC = uNear * (0.85 + 0.3*vn(xn*0.004));
  if (uVar == 1) {  // a lamp-lit level crossing every so often
    float xc = mod(xn, 5200.) - 2600.;
    nearC += vec3(1., 0.75, 0.45) * 0.55 * exp(-length(vec2(xc*0.25, P.y - nearR + 40.))/30.);
  }
  c = mix(c, nearC, nm);
  // catenary masts + wires: very fast, very blurred
  float xs = P.x + t*1500.;
  float spacing = 2400.;
  float u = fract(xs/spacing);
  float mx = (u - 0.5)*spacing;
  float blur = 1500.*0.016;                               // shutter-length smear
  float mastA = smoothstep(14. + blur, 14., abs(mx)) * 0.55;
  float armY = 150.;
  float arm = smoothstep(6., 0., abs(P.y - armY)) * smoothstep(160.+blur, 120., abs(mx + 60.)) * 0.4;
  float ws = 4.*u*(1.-u);
  float wire1 = smoothstep(2.2, 0., abs(P.y - (armY + 18. + 26.*ws)));
  float wire2 = smoothstep(1.6, 0., abs(P.y - (armY + 52. + 30.*ws)));
  c = mix(c, uMast, clamp(mastA*step(armY - 20., P.y) + arm + (wire1*0.55 + wire2*0.4), 0., 1.));
  // rain falling outside: faint slanted streaks
  vec2 rp = vec2(P.x + P.y*0.35 + t*900., P.y + t*1400.);
  float rr = h21(vec2(floor(rp.x/5.), floor(rp.y/120.)));
  float rf = step(0.93, rr) * smoothstep(0.0, 0.5, fract(rp.y/120.)) * (1.-fract(rp.y/120.));
  c = mix(c, uFog*1.1, rf*0.12);
  // atmospheric haze toward the horizon
  float haze = exp(-abs(P.y - uHorizon)/260.) * 0.18;
  return mix(c, uFog, haze);
}
void main(){
  vec2 P = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) * (${W}.0/uRes.x);
  o = vec4(world(P), 1.);
}`

// Glass: refracting beads, running drops with clear trails, condensation,
// the window frame, interior reflections, grade + grain.
const GLASS_FS = COMMON + `
out vec4 o;
uniform sampler2D uWorld;
uniform vec2 uRes;
vec3 W(vec2 P, float lod){ return textureLod(uWorld, vec2(P.x/${W}.0, 1. - P.y/${H}.0), lod).rgb; }
// returns xy = drop normal, z = mask, w = radius
vec4 beads(vec2 P, float cell, float seed, float rmin, float rmax, float dens){
  vec2 g = floor(P/cell);
  vec4 best = vec4(0.);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 c = g + vec2(i, j);
    vec3 h = h23(c + seed);
    // beads slowly gather and vanish
    float life = fract(h.z*7.3 + uT*0.03*(0.5 + h.x));
    float alive = smoothstep(0.0, 0.08, life) * smoothstep(1.0, 0.9, life);
    if (h.z > dens || alive < 0.02) continue;
    vec2 ctr = (c + 0.15 + 0.7*h.xy)*cell;
    float r = mix(rmin, rmax, pow(h21(c + seed*1.37), 2.2)) * mix(0.6, 1., alive);
    vec2 d = P - ctr;
    d.y *= d.y > 0. ? 0.86 : 1.08;
    float dist = length(d)/r;
    if (dist < 1. && r > best.w) best = vec4(d/r, smoothstep(1., 0.82, dist), r);
  }
  return best;
}
// running drops pushed back and down by the train's speed
vec4 runners(vec2 P, out float trail){
  vec2 dir = normalize(vec2(-1., 0.36));
  vec2 nrm = vec2(-dir.y, dir.x);
  vec2 q = vec2(dot(P, dir), dot(P, nrm));
  float laneW = 46.;
  float k = floor(q.y/laneW);
  trail = 0.;
  vec4 best = vec4(0.);
  for (int j = -1; j <= 1; j++) {
    float kk = k + float(j);
    vec3 h = h23(vec2(kk, 7.7));
    if (h.x > 0.42) continue;
    float wig = sin(q.x*0.011 + kk*3.1)*7. + sin(q.x*0.031 + kk)*2.5;
    float cy = (kk + 0.5)*laneW + (h.y - 0.5)*18. + wig;
    float speed = 160. + h.z*420.;
    float stutter = 0.25*sin(uT*1.7 + kk) ;
    float L = 3200.;
    float head = mod(uT*speed + stutter*40. + h.y*L, L) - 900.;
    float a = q.x - head;                       // >0 ahead of the head, <0 behind
    float r = 7. + h.z*6.;
    float len = 320. + h.y*520.;
    // the clear streak left behind
    float tw = r*0.55*smoothstep(-len, 0., a);
    float inTrail = step(-len, a) * step(a, 0.) * smoothstep(tw + 1.5, tw - 1.5, abs(q.y - cy));
    trail = max(trail, inTrail * smoothstep(-len, -len*0.6, a));
    // the head drop (slightly elongated along travel)
    vec2 d = vec2(a/(r*1.35), (q.y - cy)/r);
    float dd = length(d);
    if (dd < 1.) best = vec4(d.x*dir + d.y*nrm, smoothstep(1., 0.8, dd), r);
    // tiny beads stranded in the trail
    float bi = floor(a/22.);
    vec3 bh = h23(vec2(bi, kk));
    if (a < 0. && a > -len && bh.x < 0.45) {
      vec2 bc = vec2((bi + 0.5)*22., cy + (bh.y - 0.5)*4.);
      float br = 1.6 + bh.z*2.2;
      vec2 bd = vec2(a - bc.x, q.y - bc.y)/br;
      float bdd = length(bd);
      if (bdd < 1. && best.z == 0.) best = vec4(bd.x*dir + bd.y*nrm, smoothstep(1., 0.7, bdd), br);
    }
  }
  return best;
}
float rrect(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
void main(){
  vec2 P = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  // condensation-softened view
  vec3 base = W(P, 1.9);
  vec3 fogged = mix(base, W(P, 5.5)*1.06 + 0.02, 0.22);
  float trail;
  vec4 run = runners(P, trail);
  vec3 clear = W(P, 1.3);
  vec3 col = mix(fogged, clear, trail*0.9);
  // beads, big and small (wiped where a runner has passed)
  vec4 b = beads(P, 34., 1.3, 2.5, 10., 0.62);
  vec4 b2 = beads(P + 9., 90., 5.1, 8., 19., 0.35);
  if (b2.z > b.z) b = b2;
  b.z *= 1. - trail;
  vec4 d = run.z > 0. ? run : b;
  if (d.z > 0.) {
    vec2 n = d.xy;
    float z = sqrt(max(0., 1. - dot(n, n)));
    // a bead is a tiny inverted lens: it shows a sharper, flipped world
    vec3 lens = W(P - n*d.w*5.5 - vec2(0., d.w*2.), 0.6);
    lens *= mix(0.5, 1.08, z);
    float spec = pow(max(0., dot(normalize(vec3(n, z)), normalize(vec3(-0.45, -0.6, 0.65)))), 24.);
    lens += uReflect * spec * 0.55;
    lens += uReflect * 0.06 * smoothstep(0.6, 1., length(n));
    col = mix(col, lens, d.z);
    // contact shadow under the bead
  }
  // faint reflections of the carriage on the glass
  vec2 lp1 = vec2(900., 120.), lp2 = vec2(150., 260.);
  col += uReflect * 0.035 * (exp(-pow(length(P - lp1)/90., 2.)) + 0.7*exp(-pow(length(P - lp2)/60., 2.)));
  col += uReflect * 0.025 * smoothstep(0., 1., 1. - P.y/${H}.0);
  // window frame: the glass is a big rounded opening in the carriage wall
  float wr = rrect(P - vec2(540., 700.), vec2(510., 690.), 120.);
  float wallM = smoothstep(-10., 26., wr);
  vec3 wall = uWall * (0.8 + 0.4*smoothstep(1500., 0., P.y));
  wall += uReflect * 0.03 * exp(-abs(wr - 14.)/10.);   // the rubber seal catches light
  col = mix(col, wall, wallM);
  // grade: lifted blacks, gentle bloom, vignette, grain
  vec3 bloom = max(W(P, 6.) - 0.55, 0.) * 0.6;
  col += bloom;
  col = col*0.94 + 0.025;
  col *= uGrade;
  float vig = smoothstep(1.25, 0.35, length((P/vec2(${W}.0, ${H}.0) - 0.5)*vec2(1.0, 0.85)));
  col *= mix(0.72, 1., vig);
  col += (h21(P + fract(uT*13.)*1000.) - 0.5) * 0.022;
  o = vec4(col, 1.);
}`

const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`

function program(fs) {
  const p = gl.createProgram()
  for (const [type, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type)
    gl.shaderSource(s, src); gl.compileShader(s)
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s))
    gl.attachShader(p, s)
  }
  gl.bindAttribLocation(p, 0, 'a')
  gl.linkProgram(p)
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p))
  return p
}
const worldProg = program(WORLD_FS), glassProg = program(GLASS_FS)
const vb = gl.createBuffer()
gl.bindBuffer(gl.ARRAY_BUFFER, vb)
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW)
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0)
const tex = gl.createTexture()
gl.bindTexture(gl.TEXTURE_2D, tex)
gl.texStorage2D(gl.TEXTURE_2D, 1 + Math.floor(Math.log2(WH)), gl.RGBA8, WW, WH)
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR)
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
const fbo = gl.createFramebuffer()
gl.bindFramebuffer(gl.FRAMEBUFFER, fbo)
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0)

function setUniforms(p, v, s) {
  gl.useProgram(p)
  const u = (n) => gl.getUniformLocation(p, n)
  gl.uniform1f(u('uT'), s.t); gl.uniform1i(u('uVar'), v.id)
  gl.uniform1f(u('uBreak'), s.brk); gl.uniform1f(u('uStars'), s.stars); gl.uniform1f(u('uOpen'), s.open)
  for (const [n, k] of [['uSkyTop', 'skyTop'], ['uSkyHor', 'skyHorizon'], ['uCloud', 'cloud'], ['uBreakCol', 'breakColor'],
    ['uFar', 'far'], ['uMid', 'mid'], ['uNear', 'near'], ['uMast', 'mast'], ['uFog', 'fog'], ['uWall', 'wall'],
    ['uReflect', 'reflect'], ['uGrade', 'grade']]) gl.uniform3fv(u(n), v[k])
  gl.uniform2fv(u('uBreakPos'), v.breakPos); gl.uniform1f(u('uHorizon'), v.horizon); gl.uniform1f(u('uGlow'), v.glow)
}
function drawGL(v, s) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.viewport(0, 0, WW, WH)
  setUniforms(worldProg, v, s)
  gl.uniform2f(gl.getUniformLocation(worldProg, 'uRes'), WW, WH)
  gl.drawArrays(gl.TRIANGLES, 0, 3)
  gl.bindTexture(gl.TEXTURE_2D, tex); gl.generateMipmap(gl.TEXTURE_2D)
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H)
  setUniforms(glassProg, v, s)
  gl.uniform2f(gl.getUniformLocation(glassProg, 'uRes'), W, H)
  gl.uniform1i(gl.getUniformLocation(glassProg, 'uWorld'), 0)
  gl.drawArrays(gl.TRIANGLES, 0, 3)
}

// ---------------------------------------------------------------- phone + hand
const fg = document.getElementById('fg').getContext('2d')
const SCREEN = { w: 1082, h: 2402, scale: 0.56, top: 500 }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r) }

// A tapered capsule: circle r0 at p0 swept to circle r1 at p1.
function taper(x0, y0, r0, x1, y1, r1, p = new Path2D()) {
  const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy), th = Math.atan2(dy, dx)
  const a = Math.asin(Math.max(-1, Math.min(1, (r0 - r1) / l)))
  p.moveTo(x0 + r0*Math.cos(th + Math.PI/2 + a), y0 + r0*Math.sin(th + Math.PI/2 + a))
  p.arc(x0, y0, r0, th + Math.PI/2 + a, th + 3*Math.PI/2 - a)
  p.arc(x1, y1, r1, th - Math.PI/2 - a, th + Math.PI/2 + a)
  p.closePath()
  return p
}
// Shade across a segment's axis: lit edge toward the window (upper left).
function across(ctx, x0, y0, x1, y1, r, v, lit = 0.5) {
  const th = Math.atan2(y1 - y0, x1 - x0), nx = -Math.sin(th), ny = Math.cos(th)
  const mx = (x0 + x1)/2, my = (y0 + y1)/2
  const s = (nx*-0.6 + ny*-0.8) > 0 ? 1 : -1                 // which normal faces the light
  const g = ctx.createLinearGradient(mx + s*nx*r, my + s*ny*r, mx - s*nx*r, my - s*ny*r)
  g.addColorStop(0, v.skinLit); g.addColorStop(lit, v.skin); g.addColorStop(1, v.skinShade)
  return g
}
function softShadow(ctx, path, dx, dy, blur, a) {
  ctx.save(); ctx.filter = `blur(${blur}px)`; ctx.fillStyle = `rgba(0,0,0,${a})`
  ctx.translate(dx, dy); ctx.fill(path); ctx.restore()
}
// Light or shade that enters a shape from its outline (inner shadow), drawn
// from a mask so compound shapes (a thumb of three phalanges) read as one.
const maskA = document.createElement('canvas'), maskB = document.createElement('canvas')
const MW = 2800, MH = 2800   // covers the cached hand layers
maskA.width = maskB.width = MW; maskA.height = maskB.height = MH
function innerEdge(ctx, path, color, blur, dx, dy, width) {
  const m = ctx.getTransform()
  const a = maskA.getContext('2d'), b = maskB.getContext('2d')
  a.setTransform(1, 0, 0, 1, 0, 0); a.clearRect(0, 0, MW, MH)
  a.setTransform(m); a.fillStyle = '#000'; a.fill(path)
  b.setTransform(1, 0, 0, 1, 0, 0); b.clearRect(0, 0, MW, MH)
  b.fillStyle = color; b.fillRect(0, 0, MW, MH)
  b.globalCompositeOperation = 'destination-out'; b.drawImage(maskA, 0, 0)
  // keep only a band `width` px wide outside the shape, so the glow is a rim
  if (width) {
    a.setTransform(1, 0, 0, 1, 0, 0)
    a.filter = `blur(${width}px)`; a.drawImage(maskA, 0, 0); a.drawImage(maskA, 0, 0); a.filter = 'none'
    b.globalCompositeOperation = 'destination-in'; b.drawImage(maskA, 0, 0)
  }
  b.globalCompositeOperation = 'source-over'
  ctx.save(); ctx.clip(path); ctx.setTransform(1, 0, 0, 1, 0, 0)
  ctx.filter = `blur(${blur}px)`; ctx.drawImage(maskB, dx, dy); ctx.restore()
}
const rimLight = (ctx, path, color, w, dx, dy) => innerEdge(ctx, path, color, w*0.8, dx*2.2, dy*2.2, w*2)
const occlusion = (ctx, path, blur, a) => innerEdge(ctx, path, `rgba(40,18,10,${a})`, blur, 0, 0, blur*1.5)

function phoneGeom(sway) {
  const sw = SCREEN.w*SCREEN.scale, sh = SCREEN.h*SCREEN.scale, bez = 12
  const pw = sw + bez*2, ph = sh + bez*2
  return { sw, sh, bez, rad: 64, pw, ph, cx: 540 + sway.x, cy: SCREEN.top + ph/2 + sway.y, r: sway.r }
}

// Behind the phone: the cuff, the heel of the palm and the fingers that wrap
// round its left edge.
function drawHandBack(ctx, v, g) {
  const L = g.pw/2, B = g.ph/2
  ctx.save(); ctx.translate(g.cx, g.cy); ctx.rotate(g.r)
  // fingers (index, middle, ring) emerge from behind the left edge
  const fingers = [[-L + 10, 120, 50], [-L + 4, 222, 53], [-L + 8, 322, 50], [-L + 22, 414, 44]]
  for (let i = fingers.length - 1; i >= 0; i--) {
    const [x, y, r] = fingers[i]
    const p = taper(x + 120, y - 18, r*1.05, x - 4, y + 8, r)
    softShadow(ctx, p, 8, 16, 14, 0.45)
    ctx.fillStyle = across(ctx, x + 120, y - 18, x - 4, y + 8, r, v, 0.45); ctx.fill(p)
    occlusion(ctx, p, 10, 0.35)
    rimLight(ctx, p, v.rim, 9, -4, -3)
  }
  // heel of the palm under the phone's lower right
  const palm = new Path2D()
  palm.moveTo(L - 60, B - 170)
  palm.bezierCurveTo(L + 40, B - 220, L + 150, B - 140, L + 190, B + 40)
  palm.lineTo(L + 200, B + 400); palm.lineTo(L - 160, B + 400); palm.closePath()
  softShadow(ctx, palm, -10, 10, 20, 0.4)
  const pg = ctx.createLinearGradient(L + 150, B - 200, L - 60, B + 120)
  pg.addColorStop(0, v.skinLit); pg.addColorStop(0.45, v.skin); pg.addColorStop(1, v.skinShade)
  ctx.fillStyle = pg; ctx.fill(palm)
  rimLight(ctx, palm, v.rim, 12, 5, -2)
  ctx.restore()
}

function drawPhone(ctx, v, img, g) {
  const { sw, sh, bez, rad, pw, ph } = g
  ctx.save(); ctx.translate(g.cx, g.cy); ctx.rotate(g.r)
  ctx.save(); ctx.filter = 'blur(30px)'; ctx.fillStyle = 'rgba(0,0,0,0.5)'
  rr(ctx, -pw/2 + 6, -ph/2 + 26, pw, ph, rad); ctx.fill(); ctx.restore()
  // aluminium rail catching the window light along its upper edge
  const edge = ctx.createLinearGradient(0, -ph/2, 0, ph/2)
  edge.addColorStop(0, v.phoneEdge); edge.addColorStop(0.3, '#3a3b3f'); edge.addColorStop(1, '#141416')
  ctx.fillStyle = edge; rr(ctx, -pw/2 - 4, -ph/2 - 4, pw + 8, ph + 8, rad + 4); ctx.fill()
  ctx.fillStyle = '#050506'; rr(ctx, -pw/2, -ph/2, pw, ph, rad); ctx.fill()
  ctx.save()
  rr(ctx, -sw/2, -sh/2, sw, sh, rad - bez); ctx.clip()
  if (img) ctx.drawImage(img, -sw/2, -sh/2, sw, sh)
  const gl = ctx.createLinearGradient(-sw/2, -sh/2, sw*0.25, sh*0.05)
  gl.addColorStop(0, 'rgba(255,255,255,0.075)'); gl.addColorStop(0.5, 'rgba(255,255,255,0.015)'); gl.addColorStop(1, 'rgba(255,255,255,0)')
  ctx.fillStyle = gl; ctx.fillRect(-sw/2, -sh/2, sw, sh)
  ctx.restore()
  ctx.fillStyle = '#020203'; ctx.beginPath(); ctx.arc(0, -sh/2 + 28, 10.5, 0, Math.PI*2); ctx.fill()
  ctx.restore()
}

// In front of the phone: the thumb over the lower right, and the knit cuff.
function drawHandFront(ctx, v, g) {
  const L = g.pw/2, B = g.ph/2
  ctx.save(); ctx.translate(g.cx, g.cy); ctx.rotate(g.r)
  // thumb: metacarpal from the palm, then proximal + distal phalanx
  const base = [L + 120, B + 150], joint = [L - 10, B - 92], tip = [L - 112, B - 196]
  const thumb = new Path2D()
  taper(base[0], base[1], 92, joint[0], joint[1], 64, thumb)
  taper(joint[0], joint[1], 64, tip[0], tip[1], 54, thumb)
  softShadow(ctx, thumb, -18, 22, 18, 0.55)
  ctx.fillStyle = across(ctx, base[0], base[1], tip[0], tip[1], 80, v, 0.5); ctx.fill(thumb)
  // nail on the distal phalanx
  const th = Math.atan2(tip[1] - joint[1], tip[0] - joint[0])
  const nx = tip[0] - Math.cos(th)*22, ny = tip[1] - Math.sin(th)*22
  ctx.save(); ctx.clip(thumb)
  ctx.translate(nx, ny); ctx.rotate(th)
  const nail = new Path2D(); nail.ellipse(0, 0, 50, 31, 0, 0, Math.PI*2)
  const ng = ctx.createLinearGradient(-50, -31, 30, 31)
  ng.addColorStop(0, 'rgba(255,236,228,0.55)'); ng.addColorStop(1, 'rgba(220,170,155,0.25)')
  ctx.fillStyle = ng; ctx.fill(nail)
  ctx.strokeStyle = 'rgba(110,60,45,0.28)'; ctx.lineWidth = 2.2; ctx.stroke(nail)
  ctx.fillStyle = 'rgba(255,250,245,0.35)'; ctx.beginPath(); ctx.ellipse(-14, -12, 22, 6, -0.15, 0, Math.PI*2); ctx.fill()
  ctx.restore()
  // knuckle creases at the joint
  ctx.save(); ctx.clip(thumb); ctx.translate(joint[0], joint[1]); ctx.rotate(th)
  ctx.strokeStyle = 'rgba(80,40,28,0.22)'; ctx.lineWidth = 2
  for (const o of [-6, 4]) { ctx.beginPath(); ctx.moveTo(o, -40); ctx.quadraticCurveTo(o + 8, 0, o, 40); ctx.stroke() }
  ctx.restore()
  // the screen's own light on the thumb, the window's rim behind it
  if (v.screenGlow) {
    ctx.save(); ctx.clip(thumb); ctx.filter = 'blur(26px)'; ctx.fillStyle = v.screenGlow
    ctx.beginPath(); ctx.ellipse(tip[0] - 20, tip[1] + 10, 90, 70, 0, 0, Math.PI*2); ctx.fill(); ctx.restore()
  }
  occlusion(ctx, thumb, 12, 0.22)
  rimLight(ctx, thumb, v.rim, 10, -5, -4)
  // knit cuff over the wrist
  const cuff = new Path2D()
  cuff.moveTo(L - 40, B + 250)
  cuff.bezierCurveTo(L + 30, B + 150, L + 200, B + 90, L + 340, B + 120)
  cuff.lineTo(L + 400, B + 500); cuff.lineTo(L - 120, B + 500); cuff.closePath()
  softShadow(ctx, cuff, -16, -10, 22, 0.45)
  const cg = ctx.createLinearGradient(L - 40, B + 120, L + 260, B + 420)
  cg.addColorStop(0, v.sleeve[0]); cg.addColorStop(0.55, v.sleeve[1]); cg.addColorStop(1, v.sleeve[2])
  ctx.fillStyle = cg; ctx.fill(cuff)
  ctx.save(); ctx.clip(cuff)
  for (let i = -10; i < 30; i++) {
    const x = L - 80 + i*16
    ctx.strokeStyle = i % 2 ? 'rgba(0,0,0,0.16)' : 'rgba(255,255,255,0.08)'; ctx.lineWidth = 8
    ctx.beginPath(); ctx.moveTo(x + 40, B + 60); ctx.quadraticCurveTo(x + 10, B + 260, x - 30, B + 520); ctx.stroke()
  }
  ctx.filter = 'blur(7px)'; ctx.strokeStyle = v.rim; ctx.lineWidth = 12; ctx.stroke(cuff)
  ctx.restore()
  ctx.restore()
}

// The hand never changes shape, only position: draw it once per variant into
// phone-local layers (origin at HAND_PAD) and place them each frame.
const HAND_PAD = 1400
const handCache = new Map()
function handLayers(v) {
  if (handCache.has(v)) return handCache.get(v)
  const g0 = { ...phoneGeom({ x: 0, y: 0, r: 0 }), cx: HAND_PAD, cy: HAND_PAD, r: 0 }
  const mk = (draw) => {
    const c = document.createElement('canvas'); c.width = c.height = HAND_PAD*2
    draw(c.getContext('2d'), v, g0); return c
  }
  const layers = { back: mk(drawHandBack), front: mk(drawHandFront) }
  handCache.set(v, layers)
  return layers
}

// ---------------------------------------------------------------- frame
const ease = (a, b, x) => { const u = Math.min(1, Math.max(0, (x - a)/(b - a))); return u*u*(3 - 2*u) }
let currentVariant = VARIANTS.paper_dawn
window.setVariant = (name) => { currentVariant = VARIANTS[name] }
window.renderFrame = async ({ t, frameUrl, breakAt = 1e9, starsAt = 1e9, openAt = 1e9 }) => {
  const v = currentVariant
  let img = null
  if (frameUrl) { img = new Image(); img.src = frameUrl; await img.decode() }
  const s = { t, brk: 0.12 + 0.88*ease(breakAt - 1.5, breakAt + 4, t), stars: ease(starsAt - 1, starsAt + 3, t), open: ease(openAt - 1, openAt + 3, t) }
  drawGL(v, s)
  fg.setTransform(1, 0, 0, 1, 0, 0)
  fg.clearRect(0, 0, W, H)
  // carriage sway: a slow drift, the rail rhythm, and a joint every 1.1 s
  const sway = {
    x: 6*Math.sin(t*0.44) + 1.5*Math.sin(t*2.3),
    y: 5*Math.sin(t*0.37 + 1) + 2.2*Math.sin(t*2.51)*Math.sin(t*0.9) + 1.6*Math.max(0, Math.sin(t*Math.PI*2/1.1))**12,
    r: (-2.6 + 0.45*Math.sin(t*0.07*Math.PI*2) + 0.22*Math.sin(t*0.4*Math.PI*2)) * Math.PI/180,
  }
  const g = phoneGeom(sway)
  const layers = handLayers(v)
  const place = (c) => { fg.save(); fg.translate(g.cx, g.cy); fg.rotate(g.r); fg.drawImage(c, -HAND_PAD, -HAND_PAD); fg.restore() }
  place(layers.back)
  drawPhone(fg, v, img, g)
  place(layers.front)
  return true
}
window.ready = true
</script>
