<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promo Studio · Beautiful Quran</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/editor/editor.css">
</head>
<body>
<header>
  <div class="brand"><img src="/icon.png" alt=""><span>Promo Studio</span></div>
  <div class="row hist">
    <button id="undo" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
    <button id="redo" title="Redo (Ctrl+Shift+Z)" disabled>↷ Redo</button>
  </div>
  <div class="spacer"></div>
  <div id="emu" class="pill" title="Capture emulator">emulator …</div>
  <button id="emuBoot" class="ghost hidden">Boot emulator</button>
</header>

<main>
  <aside id="left">
    <div class="side-head">
      <h2>Videos</h2>
      <div class="row">
        <button id="newSpec" title="New video">New</button>
        <button id="dupSpec" title="Duplicate the selected video">Duplicate</button>
        <button id="delSpec" class="danger" title="Delete the selected video's spec">Delete</button>
      </div>
    </div>
    <ul id="specList"></ul>
    <div class="side-foot">
      <button id="exportAll" class="ghost" title="Export every video that has a take">Export all</button>
    </div>
  </aside>

  <section id="center">
    <div id="stageWrap">
      <canvas id="stage" title="Drag: pan · scroll: zoom · shift-scroll: rotate · alt-drag / alt-scroll: move / scale the phone"></canvas>
      <img id="exact" class="hidden" alt="exact frame">
      <div id="stageNote" class="hidden"></div>
    </div>
    <div id="transport">
      <button id="play" class="icon" title="Play / pause (space)">▶</button>
      <span id="time">0.00 / 0.00</span>
      <div class="spacer"></div>
      <button id="keyCam" title="Key the camera (zoom, pan) at the playhead (K)">◆ Key camera</button>
      <button id="presetPush" title="Ease in to the active verse over 0.9 s">Push in</button>
      <button id="presetPull" title="Ease back out to the whole phone over 0.9 s">Pull back</button>
      <button id="presetPunch" title="Cut straight to a close-up">Punch in</button>
      <button id="exactBtn" class="ghost" title="Show the compositor's exact frame (with motion blur)">Exact frame</button>
    </div>
    <div id="timeline">
      <div id="tlbar">
        <button id="split" title="Split the recording at the playhead (S)">✂ Split</button>
        <button id="delSel" class="danger" title="Delete the selected key or piece (Del)">Delete</button>
        <span class="sep"></span>
        <button id="prevKey" title="Previous key ([)">◂◆</button>
        <button id="nextKey" title="Next key (])">◆▸</button>
        <div class="spacer"></div>
        <label class="zoomer" title="Timeline zoom">⇔ <input id="pps" type="range" min="10" max="400" step="1" value="60"></label>
        <button id="fit" class="ghost" title="Fit the whole video">Fit</button>
      </div>
      <div id="tlscroll"><div id="tlinner"></div></div>
    </div>
    <div id="actions">
      <span id="saveState">—</span>
      <div class="spacer"></div>
      <button id="recordBtn" title="Record this take on the emulator (picture + the emulator's own audio)">Record take</button>
      <button id="rerecordBtn" class="ghost" title="Record again even if a take exists">Re-record</button>
      <button id="exportBtn" class="primary" title="Render the final MP4">Export MP4</button>
      <a id="openVideo" class="hidden" target="_blank">Open video ↗</a>
    </div>
  </section>

  <aside id="right">
    <nav id="tabs">
      <button data-tab="animate" class="on">Animate</button>
      <button data-tab="recording">Recording</button>
      <button data-tab="look">Look</button>
    </nav>
    <div id="panes">
      <div class="pane on" data-pane="animate"></div>
      <div class="pane" data-pane="recording"></div>
      <div class="pane" data-pane="look"></div>
    </div>
    <div id="jobs"></div>
  </aside>
</main>

<video id="screenVid" muted playsinline preload="auto" class="media"></video>
<video id="plateVid" muted playsinline loop preload="auto" class="media"></video>
<audio id="audio" preload="auto"></audio>
<img id="frameImg" class="media" alt="">
<script src="/editor/editor.js"></script>
</body>
</html>
