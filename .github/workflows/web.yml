name: Web

on:
  workflow_dispatch:
  push:
    paths:
      - 'web/**'
      - 'data/quran.db'
      - 'data/lexicon.db'
      - 'data/dictionary.db'
      - 'docs/**'
      - 'scripts/stage_site.mjs'
      - 'wrangler.jsonc'
      - 'licenses/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'data/quran.db'
      - 'data/lexicon.db'
      - 'data/dictionary.db'
      - 'docs/**'
      - 'scripts/stage_site.mjs'
      - 'wrangler.jsonc'
      - 'licenses/**'
      - '.github/workflows/web.yml'

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify canonical and built databases
        run: |
          test -s ../data/quran.db && test -s dist/quran.db
          test -s dist/timings/6.json && test -s dist/timings/19.json
          for reciter in 1 2 3 4 5 7; do
            test ! -e "dist/timings/$reciter.json"
          done
          test -s ../data/lexicon.db && test -s dist/lexicon.db
          test -s ../data/dictionary.db && test -s dist/dictionary.db

  # The product page ships from Cloudflare (wrangler.jsonc `assets`), built by
  # Cloudflare's Git integration. This only proves the staging whitelist works.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/stage_site.mjs
      - name: No web reader on the site
        run: |
          test ! -e _site/app
          if grep -rIlE 'href="app/|github\.io' _site --include='*.html'; then
            echo 'The site must not link to the web reader.'
            exit 1
          fi
