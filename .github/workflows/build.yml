name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The timing delta gate compares against the real merge base, not a
          # shallow checkout's arbitrary first parent.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify bundled Quran database asset
        run: test -s data/quran.db && test -s data/lexicon.db && test -s data/dictionary.db

      - name: Timing pipeline regressions
        run: python3 tools/test_build_db.py

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # APK assemble + rolling release are master-only. Feature-branch pushes
      # still verify the DB asset and run unit tests so PRs stay gated, but they
      # skip the slower release build and must not contend for the shared
      # "latest" tag.
      - name: Restore release keystore
        if: github.ref == 'refs/heads/master'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required $name secret." >&2
              exit 1
            fi
          done
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      # Ship the R8-optimized release build: minified, resource-shrunk and
      # non-debuggable — this is what makes it feel native-fast on device.
      - name: Assemble APK
        if: github.ref == 'refs/heads/master'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK signer
        if: github.ref == 'refs/heads/master'
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          actual="$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          expected="519ff7bc0c11ff7677c3e8fcdb4a73adacdc325cd4def42549be29219471e8b0"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected APK signing certificate: ${actual:-none}" >&2
            exit 1
          fi

      - name: Rename APK
        if: github.ref == 'refs/heads/master'
        run: cp app/build/outputs/apk/release/app-release.apk BeautifulQuran.apk

      # Release is the ship path. Artifact upload is optional convenience and
      # must not fail the job when Actions storage quota is exhausted.
      - name: Publish APK to "latest" release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retry a few times: two master pushes can still race on the tag.
          for attempt in 1 2 3; do
            gh release delete latest --cleanup-tag --yes || true
            if gh release create latest BeautifulQuran.apk \
              --prerelease \
              --title "Beautiful Quran — latest build" \
              --notes "Release-signed APK built from ${{ github.sha }}. Download on your Android phone and install (allow installs from your browser when prompted)."; then
              exit 0
            fi
            echo "Release publish attempt $attempt failed; retrying…"
            sleep $((attempt * 2))
          done
          echo "Failed to publish latest release after retries."
          exit 1

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          name: BeautifulQuran-apk
          path: BeautifulQuran.apk
          retention-days: 3
